<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - RMR Solutions</title>
    <style>
        :root {
            --primary: #0a192f;
            --secondary: #00b4d8;
            --text-light: #ccd6f6;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            line-height: 1.6;
            background-color: #f4f7f6;
            color: #333;
        }

        nav {
            background: var(--primary);
            padding: 1rem 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: var(--white);
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 40px;
            background: var(--white);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 30px;
        }

        .contact-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
            text-align: center;
        }

        .info-card {
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
        }

        .info-card h3 {
            margin-top: 0;
            color: var(--secondary);
        }

        /* Contact Form */
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
            color: var(--primary);
        }

        input, textarea {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        .btn-submit {
            background: var(--secondary);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #0096b1;
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 40px;
            color: #8892b0;
            background: var(--primary);
            margin-top: 50px;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-bottom: 20px;
            color: var(--secondary);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">RMR SOLUTIONS</a>
    </nav>

    <div class="container">
        <a href="index.html" class="back-home">&larr; Back to Home</a>
        <h1>Contact Our Team</h1>
        
        <div class="contact-info">
            <div class="info-card">
                <h3>Email Support</h3>
                <p>support@rmr.com</p>
            </div>
            <div class="info-card">
                <h3>Business Hours</h3>
                <p>Mon - Fri: 9AM - 6PM</p>
            </div>
        </div>

        <!-- Form li ghadi ysift lik l-emails (khdemt b Formspree service gratuit) -->
        <form action="https://formspree.io/f/your_id_here" method="POST">
            <div>
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Enter your name" required>
            </div>
            
            <div>
                <label>Email Address</label>
                <input type="email" name="_replyto" placeholder="yourname@email.com" required>
            </div>

            <div>
                <label>Message</label>
                <textarea name="message" placeholder="How can we help you?" required></textarea>
            </div>

            <button type="submit" class="btn-submit">Send Message</button>
        </form>
    </div>

    <footer>
        &copy; 2026 RMR Solutions. All rights reserved.
    </footer>

</body>
</html>
