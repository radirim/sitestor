<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - RMR Solutions</title>
    <style>
        :root {
            --primary: #0a192f;
            --secondary: #00b4d8;
            --text-light: #ccd6f6;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            line-height: 1.6;
            background-color: #f4f7f6;
            color: #333;
        }

        nav {
            background: var(--primary);
            padding: 1rem 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: var(--white);
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            padding: 40px;
            background: var(--white);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 { color: var(--primary); text-align: center; }

        form { display: flex; flex-direction: column; gap: 20px; }

        .form-group { display: flex; flex-direction: column; gap: 8px; }

        input, textarea {
            padding: 12px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 1rem;
        }

        .btn-send {
            background: var(--secondary);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-send:hover { background: #0096b1; }

        .back-home { display: inline-block; margin-bottom: 20px; color: var(--secondary); text-decoration: none; }
        
        /* Style dyal l-Loading status */
        #status {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            display: none; /* Makhfiy f l-bdia */
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">RMR SOLUTIONS</a>
    </nav>

    <div class="container">
        <a href="index.html" class="back-home">&larr; Back to Home</a>
        <h1>Get in Touch</h1>
        
        <form id="my-form" action="https://formspree.io/f/mdabgkkz" method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" required>
            </div>
            
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea name="message" required></textarea>
            </div>

            <button id="my-form-button" type="submit" class="btn-send">Send Message</button>
            <p id="status"></p>
        </form>
    </div>

    <!-- SCRIPT BACH Y-CATCHER L-SEND -->
    <script>
        var form = document.getElementById("my-form");
        
        async function handleSubmit(event) {
          event.preventDefault();
          var status = document.getElementById("status");
          var data = new FormData(event.target);
          
          // N-biyen beli kankhdmo
          status.style.display = "block";
          status.innerHTML = "Sending...";
          status.style.color = "orange";

          fetch(event.target.action, {
            method: form.method,
            body: data,
            headers: {
                'Accept': 'application/json'
            }
          }).then(response => {
            if (response.ok) {
              // ILA MCHA L-MESSAGE:
              status.innerHTML = "Success! Redirecting...";
              status.style.color = "green";
              alert("Thank you! Your message has been sent successfully."); // Pop-up
              window.location.href = "index.html"; // Redirect l-Home
            } else {
              response.json().then(data => {
                if (Object.hasOwn(data, 'errors')) {
                  status.innerHTML = data["errors"].map(error => error["message"]).join(", ");
                } else {
                  status.innerHTML = "Oops! There was a problem submitting your form";
                }
                status.style.color = "red";
              })
            }
          }).catch(error => {
            status.innerHTML = "Oops! There was a problem submitting your form";
            status.style.color = "red";
          });
        }
        form.addEventListener("submit", handleSubmit)
    </script>

</body>
</html>
